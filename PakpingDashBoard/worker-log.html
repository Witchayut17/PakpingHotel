<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#334c40">
  <title>Worker Log | Pakping Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=7">
  <link rel="stylesheet" href="./front-theme.css?v=31">
  <link rel="stylesheet" href="./worker-log.css?v=2">
</head>
<body>
  <div id="app">
    <div class="app-shell" hidden>
      <header class="dashboard-header">
        <div class="brand"><span class="brand-mark" aria-hidden="true">p.</span><span>Pakping Hotel</span></div>
        <nav id="log-navigation" class="dashboard-tabs" aria-label="หน้าจัดการ" hidden>
          <a class="dashboard-tab" href="./index.html#analytics">Overview</a>
          <a class="dashboard-tab is-active" href="./worker-log.html" aria-current="page">Worker Log</a>
          <a id="log-reservation-link" class="dashboard-tab" href="./index.html#pending" hidden>Reservation</a>
          <a id="log-support-link" class="dashboard-tab" href="./index.html#support" hidden>Support</a>
        </nav>
        <div id="log-account-actions" class="account-actions" hidden><span id="log-account-name"></span><a id="profile-button" class="button small" href="./index.html#profile">โปรไฟล์</a><button id="logout-button" class="button small" type="button">ออกจากระบบ</button></div>
      </header>
      <div class="main-shell">
        <main>
          <div class="page-title">
            <div><div class="eyebrow">DASHBOARD</div><h1>ประวัติการทำงานพนักงาน</h1></div>
            <div id="log-page-actions" class="page-actions" hidden>
              <button id="log-refresh" class="button" type="button" aria-label="รีเฟรชประวัติพนักงาน">รีเฟรช</button>
            </div>
          </div>
          <section id="log-access" class="card" aria-live="polite" hidden></section>
          <section id="log-panel" class="card reservations-card" aria-labelledby="log-title" hidden>
            <div class="card-heading"><div><h2 id="log-title">Worker Log</h2><p>แสดงผู้ทำรายการ บทบาท และ description ตามที่บันทึกไว้</p></div></div>
            <form id="log-filter" class="reservation-controls log-controls">
              <label class="search-field">ชื่อพนักงาน<input id="log-search" name="search" type="search" maxlength="200" placeholder="ค้นหาชื่อพนักงาน" autocomplete="off"></label>
              <label>Role<select id="log-role" name="role"><option value="">ทั้งหมด</option><option value="owner">Owner</option><option value="ceo">CEO</option><option value="reception">Receptionist</option><option value="it_support">IT Support</option><option value="housekeeper">Housekeeper</option></select></label>
              <button class="button primary" type="submit">ค้นหา</button>
              <button id="log-reset" class="button" type="button">ล้างตัวกรอง</button>
            </form>
            <p id="log-status" role="status" aria-live="polite"></p>
            <div id="log-table" class="table-scroll" tabindex="0" role="region" aria-label="ตารางประวัติการทำงาน"></div>
            <div class="table-footer log-footer"><span id="log-count"></span><nav aria-label="หน้าประวัติพนักงาน"><button id="log-prev" class="button small" type="button">ก่อนหน้า</button><span id="log-page"></span><button id="log-next" class="button small" type="button">ถัดไป</button></nav></div>
          </section>
        </main>
      </div>
    </div>
  </div>
  <script type="module" src="./worker-log.js?v=4"></script>
</body>
</html>
